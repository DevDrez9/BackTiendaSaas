# Producción con MySQL instalado directamente en el servidor (fuera de Docker).
# Uso:  docker compose up -d --build
#
# Las imágenes viven en un VOLUMEN con nombre: no se pierden al reiniciar,
# reconstruir o actualizar. (Solo "docker compose down -v" las borra: no lo uses.)

services:
  backend:
    build: .
    restart: unless-stopped
    # Red del host: el backend ve a MySQL en 127.0.0.1 igual que cualquier programa
    # del servidor (no hay que tocar bind-address ni usuarios de MySQL) y escucha
    # directo en el puerto PORT del servidor, que es donde apunta cloudflared.
    network_mode: host
    env_file: .env
    environment:
      UPLOADS_DIR: /app/uploads
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads

  frontend:
    # Ajusta la ruta a la carpeta del frontend en el servidor
    build:
      context: ../mitienda
      args:
        VITE_API_URL: ${APP_URL}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

  # Respaldo diario de las imágenes (guarda los últimos 7 días en ./backups/uploads)
  backup-uploads:
    image: alpine:3.20
    restart: unless-stopped
    volumes:
      - uploads:/uploads:ro
      - ./backups/uploads:/backups
    command: >
      sh -c "while true; do
        tar czf /backups/uploads-$$(date +%F).tar.gz -C /uploads . &&
        find /backups -name 'uploads-*.tar.gz' -mtime +7 -delete;
        sleep 86400;
      done"

volumes:
  uploads:
    name: ${UPLOADS_VOLUME_NAME:-tienda_uploads}
